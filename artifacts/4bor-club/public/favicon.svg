<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Navy background with rounded corners -->
  <rect width="180" height="180" rx="36" fill="#1e3461"/>

  <!-- Outer coin ring -->
  <circle cx="90" cy="90" r="68" fill="none" stroke="#c9a84c" stroke-width="3.5" opacity="0.6"/>
  <!-- Inner coin ring -->
  <circle cx="90" cy="90" r="57" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.35"/>

  <!-- Coin face: subtle radial glow -->
  <circle cx="90" cy="90" r="55" fill="#c9a84c" opacity="0.07"/>

  <!-- "4" numeral -->
  <text
    x="44"
    y="110"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    fill="#c9a84c"
    letter-spacing="-2"
  >4</text>

  <!-- "B" letter, slightly smaller and overlapping -->
  <text
    x="96"
    y="110"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="58"
    font-weight="700"
    fill="#ffffff"
    opacity="0.92"
  >B</text>

  <!-- Bottom serif line under text -->
  <line x1="38" y1="118" x2="142" y2="118" stroke="#c9a84c" stroke-width="1.5" opacity="0.4"/>
</svg>
