kind = "web"
previewPath = "/"
title = "4BOR Клуб"
description = "Закрытый клуб для дилеров и коллекционеров монет 4bor.ru. Страница с каталогом, аукционами, стикерами, новостями, профилем участника и административной панелью. Frontend-only, строгий минимализм, тёмно-синий с золотом."
version = "1.0.0"
id = "artifacts/4bor-club"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22995

[services.development]
run = "pnpm --filter @workspace/4bor-club run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/4bor-club", "run", "build" ]
serve = "static"
publicDir = "artifacts/4bor-club/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22995"
BASE_PATH = "/"
